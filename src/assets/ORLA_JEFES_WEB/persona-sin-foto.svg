<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Foto pendiente" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Marcador para los jefes de departamento que todavía no tienen foto.
       Fondo verde ISC con una silueta sin rostro. Al sustituirlo por la foto
       real basta con cambiar el import en src/data/team.js. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00563A"/>
      <stop offset="100%" stop-color="#00331F"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#fondo)"/>

  <!-- Silueta sin rostro -->
  <g fill="#FFFFFF" opacity="0.22">
    <circle cx="200" cy="152" r="62"/>
    <path d="M200 232c-63 0-114 44-124 102a8 8 0 0 0 8 9h232a8 8 0 0 0 8-9c-10-58-61-102-124-102z"/>
  </g>

  <!-- Aro sutil en amarillo ISC -->
  <circle cx="200" cy="152" r="62" fill="none" stroke="#FFB81C" stroke-width="3" opacity="0.35"/>
</svg>
